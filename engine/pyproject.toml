[project]
name = "veu"
version = "0.1.0"
description = "Véu — motor invisível do desktop vivo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typesafe-sdk>=0.1",
    "paramiko>=3.4",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
mcp = ["mcp>=1.0"]
browser = ["playwright>=1.40"]

[project.scripts]
veu = "veu.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veu"]
